<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nonogram助手</title>
  <style>
    :root { --ink:#17212b; --muted:#687582; --line:#9aa5ad; --accent:#1769aa; --bad:#c62828; --cell:18px; --clue-width:112px; --thin:1px; --thick:3px; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f4f6f8; color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:#17212b; color:#fff; padding:20px 28px; }
    header h1 { margin:0 0 4px; font-size:22px; }
    header p { margin:0; color:#b8c4ce; }
    main { max-width:1500px; margin:0 auto; padding:24px; }
    .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
    .upload { display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border:1px solid #b9c5cf; background:#fff; cursor:pointer; border-radius:6px; }
    .upload input { display:none; }
    button { border:0; border-radius:6px; padding:10px 16px; color:#fff; background:var(--accent); cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:wait; }
    .status { color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:20px; align-items:start; }
    .preview { max-width:100%; max-height:260px; display:block; margin:0 0 14px; border:1px solid var(--line); border-radius:6px; }
    .panel { min-width:0; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
    .panel h2 { font-size:16px; margin:0 0 14px; }
    .notice { padding:10px 12px; background:#fff7e6; border-left:4px solid #e49a16; margin-bottom:14px; }
    .success { background:#ecf8f0; border-left-color:#22834a; color:#185d35; }
    .error { background:#ffebee; border-left-color:var(--bad); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .stat { border:1px solid var(--line); padding:10px; border-radius:6px; }
    .stat strong { display:block; font-size:18px; }
    .clues > div { min-width:0; }
    .clues { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .clues pre { margin:0; white-space:pre; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; max-height:420px; overflow:auto; }
    hr { border:0; border-top:1px solid var(--line); margin:18px 0 14px; }
    .hint-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .hint-heading h2 { margin:0; }
    .hint-heading button { padding:6px 9px; font-size:12px; }
    .hint-panel { min-height:116px; padding:12px; background:#eef6ff; border:1px solid #b7d4ef; border-left:4px solid var(--accent); border-radius:6px; }
    .hint-position { color:#31566f; font-size:12px; }
    .hint-value { margin:5px 0; font-size:20px; font-weight:700; color:var(--accent); }
    .hint-reason { color:#31566f; font-size:12px; }
    .hint-count { margin-top:10px; color:#6c8292; font-size:11px; text-align:right; }
    .muted { color:var(--muted); }
    .board-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0; }
    .board-controls select { padding:5px; }
    .board-wrap { overflow:auto; padding:0; width:100%; }
    .board-stage { position:relative; }
    .puzzle-grid { transform-origin:top left; }
    .row-clue span { display:inline-block; min-width:21px; text-align:center; }
    .row-clue { gap:3px; font-variant-numeric:tabular-nums; }
    .top-clue, .row-clue { font-variant-numeric:tabular-nums; }
    .puzzle-grid { display:grid; width:max-content; background:#fff; border-top:var(--thick) solid #26323b; border-left:var(--thick) solid #26323b; }
    .puzzle-grid > div { min-width:0; min-height:0; border-right:var(--thin) solid var(--line); border-bottom:var(--thin) solid var(--line); }
    .corner { background:#f7f9fa; }
    .top-clue { height:var(--clue-height); padding:2px 1px 2px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; color:#26323b; font:700 14px/18px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .top-clue span { display:block; flex:none; height:18px; line-height:18px; min-height:18px; }
    .row-clue { width:var(--clue-width); height:var(--cell); padding:0 6px 0 3px; display:flex; align-items:center; justify-content:flex-end; color:#26323b; background:#f7f9fa; font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:nowrap; }
    .cell { width:var(--cell); height:var(--cell); display:flex; align-items:center; justify-content:center; background:#fff; font-weight:700; font-size:12px; }
    .cell.filled { background:#17212b; color:#fff; }
    .cell.empty { color:#d32f2f; background:#fff; font-size:14px; }
    .cell.wrong { outline:2px solid #ff9800; outline-offset:-2px; }
    .cell.hint-current { outline:2px solid #1976d2; outline-offset:-2px; box-shadow:inset 0 0 0 1px #fff; }
    .thick-right { border-right:var(--thick) solid #26323b !important; }
    .thick-bottom { border-bottom:var(--thick) solid #26323b !important; }
    .solution-toggle { display:inline-flex; align-items:center; gap:5px; margin-top:12px; color:var(--muted); }
    @media (max-width:900px) { :root { --cell:16px; --clue-width:98px; } main { padding:14px; } .layout { grid-template-columns:1fr; } }
    @media (max-width:520px) { :root { --cell:15px; --clue-width:86px; } .panel { padding:10px; } .preview { max-height:190px; } }
  </style>
</head>
<body>
  <header><h1>nonogram助手</h1><p>上传截图，识别提示、检查当前填写并生成完整解答。</p></header>
  <main>
    <div class="toolbar">
      <label class="upload">📷 选择图片<input id="file" type="file" accept="image/*"></label>
      <button id="paste" type="button">📋 从剪贴板粘贴</button>
      <button id="run" disabled>开始识别</button>
      <button id="download" disabled>下载 JSON</button>
      <span id="filename" class="status">尚未选择图片</span>
    </div>
    <div id="message" class="status">请选择一张数织截图。</div>
    <section id="result" hidden>
      <div class="layout">
        <div class="panel">
          <h2>识别棋盘</h2>
          <img id="preview" class="preview" alt="已上传图片预览" hidden>
          <div id="notices"></div>
          <div class="board-controls"><label>棋盘大小 <select id="boardZoom"><option value="fit">适应宽度</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><span id="boardScale" class="muted"></span></div>
          <div id="board"></div>
          <label class="solution-toggle"><input id="showSolution" type="checkbox"> 显示完整解答</label>
        </div>
        <aside class="panel">
          <h2>识别结果</h2>
          <div id="stats" class="stats"></div>
          <div class="clues"><div><strong>行提示</strong><pre id="rows"></pre></div><div><strong>列提示</strong><pre id="cols"></pre></div></div>
          <hr>
          <div class="hint-heading"><h2>下一步提示</h2><button id="refreshHint" type="button">刷新提示</button></div>
          <div id="hintPanel" class="hint-panel"></div>
        </aside>
      </div>
    </section>
  </main>
  <script>
    const file = document.querySelector('#file'), run = document.querySelector('#run');
    document.querySelector('#paste').addEventListener('click', async () => {
      try {
        if (window.pywebview && window.pywebview.api) {
          const native = await window.pywebview.api.get_clipboard_image();
          if (native.error) throw new Error(native.error);
          const response = await fetch(native.data_url);
          const blob = await response.blob();
          const dt = new DataTransfer();
          dt.items.add(new File([blob], 'clipboard.png', {type: blob.type || 'image/png'}));
          file.files = dt.files;
          file.dispatchEvent(new Event('change'));
          return;
        }
        const items = await navigator.clipboard.read();
        const item = items.find(x => x.types.some(t => t.startsWith('image/')));
        if (!item) throw new Error('剪贴板中没有图片');
        const type = item.types.find(t => t.startsWith('image/'));
        const blob = await item.getType(type);
        const dt = new DataTransfer();
        dt.items.add(new File([blob], 'clipboard.png', {type: blob.type || 'image/png'}));
        file.files = dt.files;
        file.dispatchEvent(new Event('change'));
      } catch (e) {
        alert('无法读取剪贴板图片，请先复制截图，并允许浏览器访问剪贴板。\n' + e.message);
      }
    });
    const download = document.querySelector('#download');
    const message = document.querySelector('#message'), result = document.querySelector('#result');
    const solutionToggle = document.querySelector('#showSolution');
    const refreshHint = document.querySelector('#refreshHint');
    let data = null, hintIndex = 0;
    const boardZoom = document.querySelector('#boardZoom');
    boardZoom.addEventListener('change', fitBoard);
    new ResizeObserver(fitBoard).observe(document.querySelector('#board'));
    function fitBoard() {
      const wrap = document.querySelector('.board-wrap');
      const grid = document.querySelector('.puzzle-grid');
      if (!wrap || !grid || !wrap.clientWidth) return;
      const width = grid.offsetWidth, height = grid.offsetHeight;
      const scale = boardZoom.value === 'fit' ? Math.min(1, wrap.clientWidth / width) : Number(boardZoom.value);
      grid.style.transform = `scale(${scale})`;
      const stage = grid.parentElement;
      stage.style.width = `${width * scale}px`;
      stage.style.height = `${height * scale}px`;
      document.querySelector('#boardScale').textContent = `${Math.round(scale * 100)}% · 可放大查看细节`;
    }
    file.addEventListener('change', () => {
      run.disabled = !file.files.length;
      download.disabled = true;
      document.querySelector('#filename').textContent = file.files[0]?.name || '尚未选择图片';
      if (file.files.length) {
        const preview = document.querySelector('#preview');
        preview.src = URL.createObjectURL(file.files[0]);
        preview.hidden = false;
      }
    });
    run.addEventListener('click', async () => {
      run.disabled = true; message.textContent = '正在识别，请稍候...'; result.hidden = true;
      const form = new FormData(); form.append('image', file.files[0]);
      try {
        const res = await fetch('/api/recognize', {method:'POST', body:form});
        const body = await res.json(); if (!res.ok) throw new Error(body.error || '识别失败');
        data = body; hintIndex = 0; solutionToggle.checked = false; result.hidden = false; render();
        download.disabled = false; message.textContent = `${body.cache_hit ? '已读取整图缓存' : body.auto_puzzle_match ? `已自动对齐（线索相似度 ${(body.puzzle_similarity * 100).toFixed(2)}%），复用 ${body.clue_cache_hits}/${body.clue_cache_total} 条线索并更新填写` : body.clue_cache_hit ? `已复用 ${body.clue_cache_hits}/${body.clue_cache_total} 条线索，已更新当前填写` : '识别完成'}${body.elapsed_seconds !== undefined ? ` · ${body.elapsed_seconds} 秒` : ''}`;
      } catch (e) { message.textContent = '错误：' + e.message; }
      finally { run.disabled = false; }
    });
    download.addEventListener('click', () => {
      if (!data) return;
      const blob = new Blob([JSON.stringify({
        row_clues: data.row_clues, col_clues: data.col_clues, current: data.current
      }, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'puzzle.json'; a.click();
      URL.revokeObjectURL(a.href);
    });
    solutionToggle.addEventListener('change', render);
    refreshHint.addEventListener('click', () => {
      if (!data || !data.hints?.length) return;
      hintIndex = (hintIndex + 1) % data.hints.length;
      renderHint();
      renderBoard();
    });
    function render() {
      const rows = data.row_clues, cols = data.col_clues;
      document.querySelector('#stats').innerHTML =
        `<div class="stat"><strong>${rows.length} × ${cols.length}</strong>棋盘尺寸</div>` +
        `<div class="stat"><strong>${data.filled}/${data.total}</strong>当前进度</div>`;
      document.querySelector('#rows').textContent = rows.map((x,i)=>`R${String(i+1).padStart(2,' ')}  ${x.join(' ')}`).join('\n');
      document.querySelector('#cols').textContent = cols.map((x,i)=>`C${String(i+1).padStart(2,' ')}  ${x.join(' ')}`).join('\n');
      const notes = [];
      if (!data.solvable) notes.push('<div class="notice error">题目无解：请核对 OCR 识别出的行列提示。</div>');
      if (data.issues.length) notes.push(`<div class="notice error">${data.issues.map(x=>x.message).join('<br>')}</div>`);
      if (data.solvable && !data.issues.length && !data.errors.length) {
        const percent = data.total ? Math.floor(data.filled * 100 / data.total) : 0;
        notes.push(`<div class="notice success">恭喜你，当前没有错误！已完成 ${percent}%（${data.filled}/${data.total} 格）。${percent === 100 ? '全部完成！' : '继续加油！'}</div>`);
      }
      document.querySelector('#notices').innerHTML = notes.join('');
      renderHint();
      renderBoard();
    }
    function renderHint() {
      const panel = document.querySelector('#hintPanel');
      const hints = data?.hints || [];
      const hint = hints[hintIndex];
      refreshHint.disabled = hints.length < 2;
      if (!hint) {
        panel.innerHTML = '<span class="muted">当前没有可用的下一步提示。</span>';
        return;
      }
      panel.innerHTML =
        `<div class="hint-position">第 ${hint.row} 行 · 第 ${hint.col} 列</div>` +
        `<div class="hint-value">${hint.value_cn}</div>` +
        `<div class="hint-reason">${hint.reason}</div>` +
        `<div class="hint-count">提示 ${hintIndex + 1} / ${hints.length}</div>`;
    }
    function renderBoard() {
      const rows = data.row_clues, cols = data.col_clues, current = data.current || [];
      const board = document.querySelector('#board');
      if (!current.length) { board.textContent = '没有当前棋盘'; return; }
      const shown = solutionToggle.checked && data.solution ? data.solution : current;
      const wrong = new Set((data.errors || []).map(x => `${x.row-1},${x.col-1}`));
      const selectedHint = data?.hints?.[hintIndex];
      const maxColClue = Math.max(...cols.map(c => c.length), 1);
      const clueWidth = Math.max(112, ...rows.map(clue => clue.length * 24 + 12));
      const clueHeight = maxColClue * 18 + 12;
      let html = `<div class="board-wrap"><div class="board-stage"><div class="puzzle-grid" style="--cell:22px;--clue-width:${clueWidth}px;--clue-height:${clueHeight}px;grid-template-columns:var(--clue-width) repeat(${cols.length},var(--cell));grid-template-rows:${clueHeight}px repeat(${rows.length},var(--cell))">`;
      html += '<div class="corner"></div>';
      html += cols.map((clue, c) => {
        const right = (c + 1) % 5 === 0 && c !== cols.length - 1 ? ' thick-right' : '';
        const values = Array(maxColClue - clue.length).fill('').concat(clue);
        return `<div class="top-clue${right}">${values.map(x=>`<span>${x}</span>`).join('')}</div>`;
      }).join('');
      rows.forEach((clue,r) => {
        const bottom = (r + 1) % 5 === 0 && r !== rows.length - 1 ? ' thick-bottom' : '';
        html += `<div class="row-clue${bottom}">${clue.map(x=>`<span>${x}</span>`).join('')}</div>`;
        for (let c=0;c<cols.length;c++) {
          const v = shown[r]?.[c] || '.';
          const cls = v === 'O' ? 'filled' : v === 'X' ? 'empty' : '';
          const bad = !solutionToggle.checked && wrong.has(`${r},${c}`) ? ' wrong' : '';
          const marked = selectedHint && selectedHint.row - 1 === r && selectedHint.col - 1 === c ? ' hint-current' : '';
          const right = (c + 1) % 5 === 0 && c !== cols.length - 1 ? ' thick-right' : '';
          html += `<div class="cell ${cls}${bad}${marked}${right}${bottom}">${v === 'O' ? '' : v === 'X' ? '×' : ''}</div>`;
        }
      });
      board.innerHTML = html + '</div></div></div>';
      fitBoard();
    }
  </script>
</body>
</html>
